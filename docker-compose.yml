version: '3.8'

services:
  # MongoDB Database Service
  mongodb:
    image: mongo:7.0
    container_name: crm-mongodb
    restart: unless-stopped
    ports:
      - '27017:27017'
    environment:
      MONGO_INITDB_DATABASE: crm_platform
    volumes:
      - mongo_data:/data/db
    networks:
      - crm-network
    healthcheck:
      test: ['CMD', 'mongosh', '--eval', "db.runCommand({ ping: 1 })"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Redis Cache & Message Queue Service
  redis:
    image: redis:7.2-alpine
    container_name: crm-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    networks:
      - crm-network
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  # Express.js API Backend
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: crm-server
    restart: unless-stopped
    ports:
      - '5000:5000'
    environment:
      NODE_ENV: production
      PORT: 5000
      CLIENT_URL: http://localhost
      MONGO_URI: mongodb://mongodb:27017/crm_platform
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: production_crm_jwt_access_secret_key_super_secure_32
      JWT_REFRESH_SECRET: production_crm_jwt_refresh_secret_key_super_secure_32
      JWT_ACCESS_EXPIRES_IN: 15m
      JWT_REFRESH_EXPIRES_IN: 7d
      SMTP_HOST: smtp.mailtrap.io
      SMTP_PORT: 2525
      SMTP_USER: test_user
      SMTP_PASSWORD: test_password
      SMTP_FROM: 'NexusCRM <noreply@nexuscrm.io>'
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - crm-network

  # React + Vite Client (Served by Nginx)
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: crm-client
    restart: unless-stopped
    ports:
      - '80:80'
    depends_on:
      - server
    networks:
      - crm-network

volumes:
  mongo_data:
    driver: local
  redis_data:
    driver: local

networks:
  crm-network:
    driver: bridge
